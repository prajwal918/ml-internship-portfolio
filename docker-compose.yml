version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml-internship-web:latest
    container_name: ml_internship_web
    ports:
      - "8501:8501"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
